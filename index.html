<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Happy Body</title>
  <meta name="description" content="A daily runner for The Happy Body exercise program: tempo timer, weights, levels and streak.">
  <meta name="theme-color" content="#f3e9d6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2a1d16" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Happy Body">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/ArchivoBlack.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/Archivo-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { var t = JSON.parse(localStorage.getItem('hb.settings') || '{}').theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <header class="topbar" id="topbar"></header>
    <main id="main"><div class="empty">Loading…</div></main>
  </div>
  <nav class="nav" aria-label="Sections"><div class="nav-inner" id="nav"></div></nav>
  <script type="module" src="js/app.js"></script>
</body>
</html>
